/* Layout: one column on phone with a bottom tab bar; on laptop the tabs sit on top and Labels splits into controls | sheet preview.
   Palette: baseplate grey ground, LEGO-blue actions, sticker-yellow bag codes (the codes are the thing you hunt for). */
:root{

  --fg:#151a25; --muted:#586174; --accent:#0b57c9; --accent-ink:#ffffff;
  --tag:#ffd23f; --tag-ink:#1d1704; --ok:#1d8048; --danger:#c3122d;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;

  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#181e29; --raise:#232b3a; --line:#313b4e;
  --fg:#eef1f7; --muted:#9ba5b9; --accent:#6aa5ff; --accent-ink:#08101f;
  --tag:#ffd23f; --tag-ink:#1d1704; --ok:#4cc985; --danger:#ff6b7f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#181e29; --raise:#232b3a; --line:#313b4e;
  --fg:#eef1f7; --muted:#9ba5b9; --accent:#6aa5ff; --accent-ink:#08101f;
  --tag:#ffd23f; --tag-ink:#1d1704; --ok:#4cc985; --danger:#ff6b7f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}

button,input,select,textarea{font:inherit;color:inherit}

h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,5vw,32px);line-height:1.1}
h2{font-size:19px}
h3{font-size:15px}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tabh) + 110px)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sp{flex:1}

/* Buttons: 48px minimum so dusty fingers hit them */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}

.btn.danger{color:var(--danger)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:8px}

/* Bag code tag: a yellow sticky label */
.tag{display:inline-block;font-family:var(--display);font-weight:800;font-stretch:88%;letter-spacing:.02em;background:var(--tag);color:var(--tag-ink);border-radius:5px;padding:3px 9px 2px;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:inset 0 -2px 0 rgb(0 0 0/.12)}

/* Header */
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:44px;flex:none}
.brand .name{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}

.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}

.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--raise);color:var(--muted)}

.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}

.bar{height:8px;border-radius:4px;background:var(--raise);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.bar.ok>i{background:var(--ok)}

/* Stage studs: one round stud per stage, filled when bagged / rebuilt */
.studs{display:flex;flex-wrap:wrap;gap:6px}
.stud{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;background:var(--raise);color:var(--muted);box-shadow:inset 0 -3px 0 rgb(0 0 0/.08);font-variant-numeric:tabular-nums}
.stud.on{background:var(--tag);color:var(--tag-ink)}
.stud.done{background:var(--ok);color:#fff}

/* Projects */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--fg);text-decoration:none}
.pcard:hover{border-color:var(--accent)}
.pcard .t{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15}
.pcard.new{border-style:dashed;align-items:center;justify-content:center;min-height:150px;color:var(--accent);font-weight:700}
.empty-hero{display:grid;gap:14px;padding:22px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tabh);text-decoration:none;color:var(--muted);font-weight:700;font-size:13px}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--accent)}
@media (min-width:760px){
  .wrap{padding-bottom:60px}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;display:flex;gap:4px;padding:6px;border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
  .tabs a{flex-direction:row;height:44px;padding:0 16px;border-radius:10px;font-size:15px;gap:8px}
  .tabs a svg{width:20px;height:20px}
  .tabs a[aria-current="page"]{background:var(--raise);color:var(--fg)}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* Bag list */
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px}
.group{display:flex;flex-direction:column;gap:8px}
.group-h{display:flex;align-items:baseline;gap:10px;padding:6px 2px 0}
.group-h .m{font-size:13px;color:var(--muted)}
.bag{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:64px}
.bag:hover{border-color:var(--muted)}
.bag .ref{font-weight:700}
.bag .meta{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bag .thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--raise)}
.bag.pinned{border-color:color-mix(in srgb,var(--tag) 60%,var(--line));background:color-mix(in srgb,var(--tag) 9%,var(--surface))}
.bag.missing{border-style:dashed;background:transparent;color:var(--muted)}
.pins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.gap-row{font-size:14px;color:var(--muted);padding:4px 2px}
.fab{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 20px rgb(0 0 0/.25)}
@media (min-width:760px){.fab{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.tick{width:22px;height:22px;color:var(--ok)}

/* Dialogs: full screen on phone, panel on laptop */
dialog{border:0;padding:0;background:var(--surface);color:var(--fg);width:100%;max-width:100%;height:100%;max-height:100%;margin:0}
dialog::backdrop{background:rgb(10 14 22/.55)}
@media (min-width:760px){dialog{width:min(640px,92vw);height:auto;max-height:92vh;margin:auto;border-radius:16px;border:1px solid var(--line)}}
dialog form{display:flex;flex-direction:column;height:100%;max-height:inherit}
.dlg-head{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));padding-top:max(8px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dlg-head h2{flex:1;text-align:center}
.dlg-head .sp{width:84px}
.dlg-body{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.dlg-foot{display:flex;flex-wrap:wrap;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.dlg-foot .btn.primary{flex:1 1 200px}
.preview{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border-radius:12px;background:var(--raise)}
.preview .l2{font-weight:700;font-size:17px;min-height:1.4em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field .lab{font-weight:700;font-size:15px}
.opt{font-weight:400;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.inp,textarea.inp,select.inp{width:100%;min-height:52px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 14px;font-size:18px}
textarea.inp{padding:12px 14px;min-height:72px;resize:vertical;font-size:16px}
select.inp{font-size:16px}
.inp.n{font-family:var(--display);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.stepper{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:6px}
.stepper button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:26px;font-weight:700;line-height:1}
.range{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:48px;min-height:48px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-family:var(--display);font-weight:800;font-size:17px}
.chip[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.chip:disabled{opacity:.4;text-decoration:line-through;cursor:default}
.pcs{display:flex;flex-wrap:wrap;gap:6px}
.pcs .inp{flex:1 1 100%;width:auto}
.pcs .chip{flex:1 1 0}
.pcs .chip{font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .chip{font-size:15px;padding:0 14px}
.hint{margin:0;font-size:14px;color:var(--muted)}

.photo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.ask{padding:20px;display:flex;flex-direction:column;gap:14px}
#askDlg{height:auto;max-width:440px;margin:auto;border-radius:16px;width:calc(100% - 32px)}

/* Index table */
.tablewrap{overflow-x:auto}
table.idx{width:100%;border-collapse:collapse;font-size:15px}
.idx th,.idx td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.idx thead th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.idx tr.gh th{background:var(--raise);font-family:var(--display);font-size:15px;text-transform:none;letter-spacing:0;color:var(--fg)}
.idx .cb{width:28px}
.idx .cb span{display:inline-block;width:16px;height:16px;border:2px solid var(--muted);border-radius:3px}
.idx .code{font-family:var(--display);font-weight:800;white-space:nowrap}
.idx td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.idx-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:10px}

/* Labels */
.labels-grid{display:grid;gap:14px}
@media (min-width:860px){.labels-grid{grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}}
.sel-list{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.sel-list label{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 8px;border-radius:8px}

.sel-list input{width:22px;height:22px;accent-color:var(--accent)}
.sel-list .r{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheets{display:flex;flex-direction:column;gap:16px}
.sheet-frame{position:relative;overflow:hidden;border-radius:4px;box-shadow:0 2px 12px rgb(0 0 0/.18);max-width:100%}

.sheet{position:relative;background:#fff;color:#000;overflow:hidden}
.lbl{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;color:#000}

details summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.lay{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}

/* Rebuild */
.next{display:grid;gap:12px;padding:18px;border-radius:16px;background:var(--surface);border:2px solid var(--accent)}
.next .l2{font-size:20px;font-weight:700}
.next img{max-height:180px;border-radius:10px;object-fit:cover}
.crow{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:60px}
.crow .box{width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center}
.crow .box svg{width:20px;height:20px;opacity:0}
.crow.done{background:transparent}
.crow.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.crow.done .box svg{opacity:1}
.crow.done .tag{opacity:.55}
.crow .meta{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow.is-next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

#toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 86px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgb(0 0 0/.3)}
#toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
#printRoot{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Print: only #printRoot is printed. @page is set per job in #pageStyle. */
@media print{
  body{background:#fff;color:#000}

  #printRoot{display:block}
  .sheet{break-after:page;page-break-after:always}

  .print-idx .idx tr{break-inside:avoid}
  .print-idx .idx .cb span{border-color:#000}
}

/* ---------- storage: IndexedDB, with an in-memory fallback when the browser blocks it ---------- */
const DB = (() => {
  const STORES = ['projects', 'bags', 'photos'];
  let mem = null, dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('bag-and-tag', 1);
    r.onupgradeneeded = () => STORES.forEach(s => r.result.objectStoreNames.contains(s) || r.result.createObjectStore(s, { keyPath: 'id' }));
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
    setTimeout(() => rej(new Error('timeout')), 4000);
  }));
  const req = (st, mode, make) => open().then(d => new Promise((res, rej) => {
    const t = d.transaction(st, mode); const r = make(t.objectStore(st));
    t.oncomplete = () => res(r.result); t.onerror = t.onabort = () => rej(t.error);
  }));
  return {
    async init() { try { await open(); return true; } catch { mem = Object.fromEntries(STORES.map(s => [s, new Map()])); return false; } },
    all: st => mem ? Promise.resolve([...mem[st].values()]) : req(st, 'readonly', s => s.getAll()),
    get: (st, id) => mem ? Promise.resolve(mem[st].get(id)) : req(st, 'readonly', s => s.get(id)),
    put: (st, v) => mem ? (mem[st].set(v.id, v), Promise.resolve()) : req(st, 'readwrite', s => s.put(v)),
    del: (st, id) => mem ? (mem[st].delete(id), Promise.resolve()) : req(st, 'readwrite', s => s.delete(id)),
    get saved() { return !mem; },
  };
})();

/* ---------- state ---------- */
const S = {
  projects: [], bags: [], route: { view: 'home' }, q: '', hideDone: ls.get('bt_hideDone', false),
  photoURLs: new Map(), labelSel: null, labelSelFor: null, wake: null,
  lo: Object.assign({ preset: 'L7160', start: 1, outline: false, extra: false, dx: 0, dy: 0, custom: null }, ls.get('bt_labels', {})),
};
const proj = id => S.projects.find(p => p.id === id);
const bagsOf = pid => S.bags.filter(b => b.projectId === pid);
const codeOf = (b, p) => b.kind === 'stage' ? `${p.code}-${b.stage}-${b.letter}` : `${p.code}-${SPECIAL[b.kind].suffix}`;
const lowStep = b => (b.stepFrom != null && b.stepTo != null) ? Math.min(b.stepFrom, b.stepTo) : (b.stepFrom ?? b.stepTo ?? Infinity);
function refOf(b) {
  const a = b.stepFrom, z = b.stepTo;
  let st = '';
  if (a != null && z != null && a !== z) st = `steps ${Math.min(a, z)}–${Math.max(a, z)}`;
  else if (a != null || z != null) st = `step ${a ?? z}`;
  if (b.booklet != null) return st ? `Bk ${b.booklet} · ${st}` : `Bk ${b.booklet}`;
  return st ? st[0].toUpperCase() + st.slice(1) : '';
}
const line2 = b => b.kind === 'stage' ? (refOf(b) || `Stage ${b.stage}`) : SPECIAL[b.kind].title;
// Rebuild order: stage, then booklet, then lowest step. Letters follow teardown order, so they are only the tie-break.
const byBuild = (a, b) => a.stage - b.stage || (a.booklet ?? 999) - (b.booklet ?? 999) || lowStep(a) - lowStep(b) || a.letter.localeCompare(b.letter);
const stageBags = pid => bagsOf(pid).filter(b => b.kind === 'stage').sort(byBuild);
const specialBag = (pid, k) => bagsOf(pid).find(b => b.kind === k) || null;
const specialBags = pid => KINDS.map(k => specialBag(pid, k)).filter(Boolean);
const ordered = pid => [...specialBags(pid), ...stageBags(pid)];
function stageGroups(pid) {
  const m = new Map();
  for (const b of stageBags(pid)) { if (!m.has(b.stage)) m.set(b.stage, []); m.get(b.stage).push(b); }
  return m;
}
function nextLetter(pid, stage, exceptId) {
  const used = new Set(bagsOf(pid).filter(b => b.kind === 'stage' && b.stage === stage && b.id !== exceptId).map(b => b.letter));
  return [...LETTERS].find(L => !used.has(L)) || 'Z';
}
function stats(p) {
  const bs = bagsOf(p.id);
  return { n: bs.length, pcs: bs.reduce((s, b) => s + (b.pieces || 0), 0), done: bs.filter(b => b.rebuiltAt).length };
}

/* ---------- photos ---------- */
async function photoURL(id) {
  if (S.photoURLs.has(id)) return S.photoURLs.get(id);
  const rec = await DB.get('photos', id);
  if (!rec) return null;
  const u = URL.createObjectURL(rec.blob); S.photoURLs.set(id, u); return u;
}
function hydratePhotos(root = document) {
  root.querySelectorAll('img[data-photo]').forEach(async img => { const u = await photoURL(img.dataset.photo); if (u) img.src = u; else img.remove(); });
}
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Bags tab ---------- */
function studs(p, mode) {
  const groups = stageGroups(p.id);
  const max = Math.max(p.stages || 0, ...groups.keys(), 0);
  if (!max) return '';
  let out = '';
  for (let i = 1; i <= max; i++) {
    const g = groups.get(i) || [];
    const cls = mode === 'rebuild' ? (g.length && g.every(b => b.rebuiltAt) ? 'done' : g.length ? 'on' : '') : (g.length ? 'on' : '');
    out += `<span class="stud ${cls}" title="Stage ${i}: ${g.length} bag${g.length === 1 ? '' : 's'}">${i}</span>`;
  }
  return `<div class="studs" aria-label="Stages">${out}</div>`;
}
function viewBags(p, s) {
  const last = [...bagsOf(p.id)].sort((a, b) => b.createdAt - a.createdAt)[0];
  return `<section class="stats">
      <div class="stat"><div class="num">${s.n}</div><div class="sub">bags packed</div></div>
      <div class="stat"><div class="num">~${fmt(s.pcs)}</div><div class="sub">${p.pieces ? `of ${fmt(p.pieces)} pieces bagged` : 'pieces bagged'}</div>${p.pieces ? `<div class="bar"><i style="width:${Math.min(100, Math.round(s.pcs / p.pieces * 100))}%"></i></div>` : ''}</div>

    <div id="bagList" class="stack">${bagListHTML(p)}</div>

}
function bagRow(b, p) {
  const meta = [b.pieces && `~${fmt(b.pieces)} pcs`, b.tub, b.notes].filter(Boolean).join(' · ');
  return `<button type="button" class="bag ${b.kind !== 'stage' ? 'pinned' : ''}" data-act="editBag" data-id="${b.id}">

function bagListHTML(p) {
  const q = S.q.trim().toLowerCase();
  if (q) {
    const hits = ordered(p.id).filter(b => [codeOf(b, p), line2(b), b.notes, b.tub].join(' ').toLowerCase().includes(q));
    return hits.length ? `<div class="group">${hits.map(b => bagRow(b, p)).join('')}</div>` : `<p class="muted">No bag matches “${esc(S.q)}”.</p>`;
  }
  const pins = KINDS.map(k => {
    const b = specialBag(p.id, k);
    return b ? bagRow(b, p) : `<button type="button" class="bag missing" data-act="addBag" data-kind="${k}"><span class="tag ghost lg">${esc(p.code)}-${SPECIAL[k].suffix}</span><span>${esc(SPECIAL[k].title)}</span><span>${ico.plus.replace('<svg', '<svg width="22" height="22"')}</span></button>`;
  }).join('');
  const groups = stageGroups(p.id);
  const max = Math.max(p.stages || 0, ...groups.keys(), 0);
  let stagesHTML = '', gap = [];
  const flushGap = () => { if (gap.length) { stagesHTML += `<div class="gap-row">Stage ${gap.length > 1 ? `${gap[0]}–${gap[gap.length - 1]}` : gap[0]}: nothing bagged yet</div>`; gap = []; } };
  for (let i = 1; i <= max; i++) {
    const g = groups.get(i);
    if (!g) { gap.push(i); continue; }
    flushGap();
    stagesHTML += `<div class="group"><div class="group-h"><h3>Stage ${i}</h3><span class="m tnum">${g.length} bag${g.length === 1 ? '' : 's'} · ~${fmt(g.reduce((s, b) => s + (b.pieces || 0), 0))} pcs</span></div>${g.map(b => bagRow(b, p)).join('')}</div>`;
  }
  flushGap();
  return `<div class="group"><div class="group-h"><h3>Special bags</h3><span class="m">pinned</span></div><div class="pins">${pins}</div></div>
    ${groups.size ? stagesHTML : `<div class="notice">No stage bags yet. Start with the last stage of the booklet: tap <b>Add bag</b> as each section comes apart.</div>`}`;
}

function newBag(p, kind = 'stage') {
  const mine = [...bagsOf(p.id)].sort((a, b) => b.createdAt - a.createdAt);
  const last = mine.find(b => b.kind === 'stage');
  const stage = last?.stage ?? (p.stages || 1);
  let booklet = last ? last.booklet : (p.booklets || null), stepTo = null;
  // Teardown runs backwards, so the next bag usually ends one step before the last one started.
  if (last && Number.isFinite(lowStep(last))) {
    if (lowStep(last) > 1) stepTo = lowStep(last) - 1;
    else if (booklet > 1) booklet -= 1;
  }
  return { id: null, projectId: p.id, kind, stage, letter: nextLetter(p.id, stage), letterTouched: false, booklet, stepFrom: null, stepTo, pieces: null, notes: '', tub: mine[0]?.tub || '', photoId: null, photoBlob: null, photoRemoved: false, previewURL: null };

  const doc = specialBag(p.id, 'doc');
  return `<section class="panel stack" style="gap:8px">
      <div class="row"><div class="num" style="font-family:var(--display);font-weight:800;font-size:26px">${s.done} of ${s.n} bags rebuilt</div><span class="sp"></span><span class="muted tnum">${pct}%</span></div>
      <div class="bar ok" style="height:12px;border-radius:6px"><i style="width:${pct}%"></i></div>
      ${studs(p, 'rebuild')}
    </section>
    ${next ? `<section class="next">
      <div class="eyebrow">Open next</div>
      <div class="row"><span class="tag xl">${esc(codeOf(next, p))}</span><div style="min-width:0"><div class="l2">${esc(line2(next))}</div><div class="muted">${esc([next.pieces && `~${fmt(next.pieces)} pcs`, next.tub && `in ${next.tub}`].filter(Boolean).join(' · '))}</div></div></div>
      ${next.notes ? `<div>${esc(next.notes)}</div>` : ''}
      ${next.photoId ? `<img data-photo="${next.photoId}" alt="Photo of ${esc(codeOf(next, p))}">` : ''}
      <button type="button" class="btn primary big" data-act="toggleRebuilt" data-id="${next.id}">${ico.check}Opened ${esc(codeOf(next, p))}</button>
    </section>` : `<section class="next" style="border-color:var(--ok)"><h2>Rebuild complete</h2><p class="muted" style="margin:0">All ${s.n} bags are ticked off.</p></section>`}
    <div class="row">
      <label class="check"><input type="checkbox" id="hideDone" ${S.hideDone ? 'checked' : ''}>Hide rebuilt bags</label>
      <span class="sp"></span>
      ${'wakeLock' in navigator ? `<button type="button" class="btn sm" data-act="wake" aria-pressed="${!!S.wake}">${S.wake ? 'Screen stays on' : 'Keep screen on'}</button>` : ''}
      ${s.done ? '<button type="button" class="btn sm ghost danger" data-act="resetRebuild">Reset</button>' : ''}
    </div>
    ${doc || keep.length ? `<div class="group"><div class="group-h"><h3>Special bags</h3><span class="m">${doc ? 'open DOC first; ' : ''}keep PRINT and SPARE handy</span></div>
      ${[doc, ...keep].filter(b => b && !hide(b)).map(b => crow(b, p, b === next)).join('')}</div>` : ''}
    ${groups}`;
}
async function toggleRebuilt(id, silent) {
  const b = S.bags.find(x => x.id === id); if (!b) return;
  const p = proj(b.projectId);
  b.rebuiltAt = b.rebuiltAt ? null : Date.now();
  await DB.put('bags', b); await touch(p);
  const y = scrollY; render(); scrollTo(0, y);
  if (!silent) toast(b.rebuiltAt ? `${codeOf(b, p)} rebuilt` : `${codeOf(b, p)} back to unopened`, { label: 'Undo', run: () => toggleRebuilt(id, true) });
}
async function requestWake() {
  try { S.wake = await navigator.wakeLock.request('screen'); S.wake.addEventListener('release', () => { S.wake = null; }); } catch { S.wake = null; toast('This browser would not keep the screen on.'); }
}
function releaseWake() { if (S.wake) { S.wake.release().catch(() => {}); S.wake = null; } }

/* ---------- printing ---------- */
let pendingMark = null;
async function printJob(html, pageCss) {
  $('#printRoot').innerHTML = html;
  $('#pageStyle').textContent = pageCss;
  try { await document.fonts.ready; } catch {}
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  window.print();
}
addEventListener('afterprint', () => {
  if (!pendingMark) return;
  const { ids, pid } = pendingMark; pendingMark = null;
  toast(`Mark ${ids.length} label${ids.length === 1 ? '' : 's'} as printed?`, { label: 'Mark printed', run: async () => {
    for (const id of ids) { const b = S.bags.find(x => x.id === id); if (b) { b.labelledAt = Date.now(); await DB.put('bags', b); } }
    S.labelSel = null; S.labelSelFor = null;
    if (S.route.id === pid) render();
  } });
});

/* ---------- backup ---------- */
const blobToData = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportData() {
  const photos = await DB.all('photos');
  const data = { app: 'bag-and-tag', version: 1, exportedAt: new Date().toISOString(), projects: S.projects, bags: S.bags,
    photos: await Promise.all(photos.map(async ph => ({ id: ph.id, data: await blobToData(ph.blob) }))) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = `bag-and-tag-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast('Backup saved to your downloads');
}
async function importData(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast('That file is not a Bag & Tag backup.'); }
  if (data?.app !== 'bag-and-tag' || !Array.isArray(data.projects)) return toast('That file is not a Bag & Tag backup.');
  const ok = await ask({ title: 'Restore this backup?', body: `${data.projects.length} sets and ${data.bags?.length || 0} bags. Sets already here with the same ID are replaced; others are kept.`, ok: 'Restore' });
  if (!ok) return;
  for (const ph of data.photos || []) { try { await DB.put('photos', { id: ph.id, blob: await (await fetch(ph.data)).blob() }); } catch {} }
  for (const p of data.projects) await DB.put('projects', p);
  for (const b of data.bags || []) await DB.put('bags', b);
  await load(); render(); toast('Backup restored');
}

/* ---------- example data ---------- */
async function loadExample() {
  const code = S.projects.some(p => p.code === 'X') ? 'EX' + (S.projects.length + 1) : 'X';
  const p = { id: uid(), name: 'Example teardown', setNumber: '00000', code, pieces: 7500, booklets: 4, stages: 17, example: true,
    notes: 'Made-up bags to show how the app works. Delete this set from Edit set when you are done.', createdAt: Date.now(), updatedAt: Date.now() };
  const t0 = Date.now() - 3600e3;
  const rows = [
    ['doc', null, null, null, null, null, null, 'Booklets 1–4, sticker sheet', 'Tub 1'],
    ['print', null, null, null, null, null, 40, 'Printed tiles, plaque, minifig torsos', 'Tub 1'],
    ['stage', 17, 'A', 4, 590, 612, 180, 'Top hull plates, rear', 'Tub 1'],
    ['stage', 17, 'B', 4, 568, 589, 220, 'Top hull plates, front', 'Tub 1'],
    ['stage', 16, 'A', 4, 541, 567, 260, 'Radar dish and turret', 'Tub 1'],
    ['stage', 16, 'B', 4, 520, 540, 310, 'Side panels, port', 'Tub 1'],
    ['stage', 16, 'C', 4, 500, 519, 150, 'Side panels, starboard', 'Tub 2'],
    ['stage', 15, 'A', 3, 470, 499, 240, 'Cockpit and corridor', 'Tub 2'],
    ['stage', 15, 'B', 3, 452, 469, 200, 'Mandible greebles', 'Tub 2'],
  ];
  await DB.put('projects', p); S.projects.push(p);
  let i = 0;
  for (const [kind, stage, letter, booklet, a, z, pieces, notes, tub] of rows) {
    const b = { id: uid(), projectId: p.id, kind, stage, letter, booklet, stepFrom: a, stepTo: z, pieces, notes, tub, photoId: null, createdAt: t0 + (i++) * 60e3, updatedAt: Date.now(), rebuiltAt: null, labelledAt: null };
    await DB.put('bags', b); S.bags.push(b);
  }
  go(`#/p/${p.id}/bags`);
}

/* ---------- events ---------- */
const A = {
  newProject: el => openProject(null, el.dataset.falcon),
  editProject: () => openProject(proj(S.route.id)),
  loadExample,
  addBag: el => openBag(newBag(proj(S.route.id), el.dataset.kind || 'stage')),
  editBag: el => { const b = S.bags.find(x => x.id === el.dataset.id); openBag({ ...b, letterTouched: true, photoBlob: null, photoRemoved: false, previewURL: null }); },
  closeDlg: el => el.closest('dialog').close(),
  kind: el => { F.kind = el.dataset.k; renderBagForm(); },
  step: el => {
    const f = el.dataset.f, d = +el.dataset.d, inp = $('#f_' + f);
    const v = Math.max(1, (int(inp.value) ?? (d > 0 ? 0 : 2)) + d);
    inp.value = v; bagFormInput({ target: inp });
  },
  letter: el => { F.letter = el.dataset.l; F.letterTouched = true; updateBagPreview(); },
  pcs: el => { F.pieces = +el.dataset.n; $('#f_pieces').value = F.pieces; updateBagPreview(); },
  removePhoto: () => { if (F.previewURL) URL.revokeObjectURL(F.previewURL); F.photoBlob = null; F.previewURL = null; F.photoRemoved = true; renderBagForm(); },
  deleteBag: async () => {
    const b = S.bags.find(x => x.id === F.id), p = proj(b.projectId);
    if (!await ask({ title: `Delete ${codeOf(b, p)}?`, body: 'This removes the bag and its photo from the log.', ok: 'Delete', danger: true })) return;
    await DB.del('bags', b.id); if (b.photoId) await DB.del('photos', b.photoId);
    S.bags = S.bags.filter(x => x.id !== b.id); await touch(p);
    F = null; $('#bagDlg').close(); render(); toast(`Deleted ${codeOf(b, p)}`);
  },
  deleteProject: async () => {
    const p = proj(PF.id), n = bagsOf(p.id).length;
    if (!await ask({ title: `Delete ${p.name}?`, body: `This deletes the set and all ${n} bag records. Save a backup first if you might want them.`, ok: 'Delete set', danger: true })) return;
    for (const b of bagsOf(p.id)) { await DB.del('bags', b.id); if (b.photoId) await DB.del('photos', b.photoId); }
    await DB.del('projects', p.id);
    S.bags = S.bags.filter(b => b.projectId !== p.id); S.projects = S.projects.filter(x => x.id !== p.id);
    $('#projDlg').close(); PF = null; go('#/'); render();
  },
  toggleRebuilt: el => toggleRebuilt(el.dataset.id),
  resetRebuild: async () => {
    const p = proj(S.route.id);
    if (!await ask({ title: 'Reset rebuild progress?', body: 'Every bag goes back to unopened. The bag log is not changed.', ok: 'Reset', danger: true })) return;
    for (const b of bagsOf(p.id)) if (b.rebuiltAt) { b.rebuiltAt = null; await DB.put('bags', b); }
    render();
  },
  wake: async () => { if (S.wake) { S.wakeWanted = false; releaseWake(); } else { S.wakeWanted = true; await requestWake(); } render(); },
  sel: el => {
    const p = proj(S.route.id), all = ordered(p.id), s = el.dataset.s;
    S.labelSel = new Set(s === 'all' ? all.map(b => b.id) : s === 'fresh' ? all.filter(b => !b.labelledAt).map(b => b.id) : []);
    refreshLabels();
  },
  printLabels: () => {
    const p = proj(S.route.id), chosen = labelBags(p), L = layout();
    pendingMark = { ids: chosen.map(b => b.id), pid: p.id };
    printJob(sheetsHTML(p, chosen, false), `@page{size:${L.page[0]}mm ${L.page[1]}mm;margin:0}`);
  },
  printIndex: () => printJob(`<div class="print-idx">${indexHTML(proj(S.route.id))}</div>`, '@page{size:A4;margin:12mm}'),
  exportData,
  importData: () => $('#importFile').click(),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = A[el.dataset.act];
  if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest('#bagDlg')) return bagFormInput(e);
  if (t.id === 'p_code' || t.id === 'p_name') {
    if (t.id === 'p_code') PF.codeTouched = true;
    if (t.id === 'p_name' && !PF.codeTouched) $('#p_code').value = (t.value.trim()[0] || '').toUpperCase();
    return projHint();
  }
  if (t.id === 'bagSearch') { S.q = t.value; $('#bagList').innerHTML = bagListHTML(proj(S.route.id)); hydratePhotos($('#bagList')); return; }
  if (t.id === 'lo_start') { S.lo.start = Math.max(1, int(t.value) || 1); saveLO(); return updateSheetPreview(); }
  if (t.id?.startsWith('lo_') && LAYKEYS.some(([k]) => 'lo_' + k === t.id)) {
    const k = t.id.slice(3), v = fl(t.value); if (v == null) return;
    if (k === 'dx' || k === 'dy') S.lo[k] = v;
    else {
      const L = layout(); const c = { ...L, page: [...L.page] }; delete c.outline; delete c.name;
      if (k === 'page0') c.page[0] = v; else if (k === 'page1') c.page[1] = v; else c[k] = v;
      S.lo.custom = c; if (S.lo.preset !== 'custom') { if (S.lo.preset === 'CUT') S.lo.outline = true; S.lo.preset = 'custom'; $('#lo_preset').value = 'custom'; }
    }
    saveLO(); updateSheetPreview();
  }
});
function updateSheetPreview() {
  const p = proj(S.route.id), el = $('#sheetPreview'); if (!el) return;
  const chosen = labelBags(p);
  el.innerHTML = sheetsHTML(p, chosen, true); fitSheets();
  const b = $('#printBtn'); if (b) { b.innerHTML = printBtnHTML(chosen.length); b.disabled = !chosen.length; }
  const c = $('#selCount'); if (c) c.textContent = `${chosen.length} of ${ordered(p.id).length}`;
}
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'f_photo' && t.files[0]) {
    try { const blob = await shrink(t.files[0]); if (F.previewURL) URL.revokeObjectURL(F.previewURL); F.photoBlob = blob; F.previewURL = URL.createObjectURL(blob); F.photoRemoved = false; renderBagForm(); }
    catch { toast('That photo could not be read. Try another.'); }
    return;
  }
  if (t.id === 'importFile' && t.files[0]) { await importData(t.files[0]); t.value = ''; return; }
  if (t.id === 'lo_preset') { S.lo.preset = t.value; if (t.value === 'custom' && !S.lo.custom) { const L = PRESETS.L7160; S.lo.custom = { ...L, page: [...L.page] }; } saveLO(); return refreshLabels(); }
  if (t.id === 'lo_outline') { S.lo.outline = t.checked; saveLO(); return updateSheetPreview(); }
  if (t.id === 'lo_extra') { S.lo.extra = t.checked; saveLO(); return updateSheetPreview(); }
  if (t.dataset.sel) { t.checked ? S.labelSel.add(t.dataset.sel) : S.labelSel.delete(t.dataset.sel); return updateSheetPreview(); }
  if (t.id === 'hideDone') { S.hideDone = t.checked; ls.set('bt_hideDone', S.hideDone); const y = scrollY; render(); scrollTo(0, y); }
});
document.addEventListener('submit', e => {
  // Leave <form method="dialog"> (the confirm dialog) to close itself.
  if (e.target.id === 'bagForm') { e.preventDefault(); saveBag(e.submitter?.value === 'next'); }
  else if (e.target.id === 'projForm') { e.preventDefault(); saveProject(); }
});
$('#bagDlg').addEventListener('close', () => { if (F?.previewURL) URL.revokeObjectURL(F.previewURL); F = null; });
document.addEventListener('toggle', e => { if (e.target.id === 'layDetails') S.layOpen = e.target.open; }, true);
addEventListener('hashchange', () => { S.q = ''; render(); scrollTo(0, 0); });
addEventListener('resize', () => fitSheets());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.route.tab === 'rebuild' && S.wakeWanted) requestWake(); });

/* ---------- boot ---------- */
async function load() {
  S.projects = await DB.all('projects');
  S.bags = await DB.all('bags');
}
(async () => {
  await DB.init();
  try { await navigator.storage?.persist?.(); } catch {}
  await load();
  if (!location.hash || location.hash === '#') {
    const last = ls.get('bt_last', null);
    if (last && proj(last)) { try { history.replaceState(null, '', `#/p/${last}/bags`); } catch {} }
  }
  render();
})();
})();
</script>
